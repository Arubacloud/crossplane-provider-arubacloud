apiVersion: arubacloud.arubacloud.crossplane.io/v1alpha1
kind: Vpnroute
metadata:
  annotations:
    meta.upbound.io/example-id: arubacloud/v1alpha1/vpnroute
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    location: ITBG-Bergamo
    name: example-vpn-route
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    properties:
      cloudSubnet: 10.0.1.0/24
      onPremSubnet: 192.168.1.0/24
    vpnTunnelIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
