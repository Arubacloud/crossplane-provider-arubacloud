apiVersion: arubacloud.arubacloud.m.crossplane.io/v1alpha1
kind: Backup
metadata:
  annotations:
    meta.upbound.io/example-id: arubacloud/v1alpha1/backup
  labels:
    testing.upbound.io/example-name: basic
  name: basic
  namespace: crossplane-system
spec:
  forProvider:
    billingPeriod: monthly
    location: ITBG-Bergamo
    name: example-backup
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    retentionDays: 30
    tags:
    - env:dev
    - service:demo
    type: full
    volumeIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
