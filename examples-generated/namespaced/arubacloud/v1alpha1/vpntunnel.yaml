apiVersion: arubacloud.m.crossplane.io/v1alpha1
kind: Vpntunnel
metadata:
  annotations:
    meta.upbound.io/example-id: arubacloud/v1alpha1/vpntunnel
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    location: ITBG-Bergamo
    name: example-vpn-tunnel
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    properties:
      vpnClientProtocol: ikev2
      vpnType: Site-To-Site
