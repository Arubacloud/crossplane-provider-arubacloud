apiVersion: arubacloud.arubacloud.crossplane.io/v1alpha1
kind: Cloudserver
metadata:
  name: web-01
spec:
  forProvider:
    name: web-01
    location: ITBG-Bergamo
    zone: ITBG-1
    tags:
      - crossplane
      - web

    projectIdRef:
      name: my-project

    network:
      # vpcUriRefRef resolves the VPC's uri from status.atProvider and injects
      # it into the network.vpc_uri_ref Terraform field.
      vpcUriRefRef:
        name: main-vpc
      subnetUriRefsRefs:
        - name: private-subnet
      # No ElasticIP attached — server will use a dynamic IP.
      # Uncomment to attach a static IP:
      # elasticIpUriRefRef:
      #   name: web-eip

    settings:
      flavorName: CSO4A8
      keyPairUriRefRef:
        name: my-keypair
      # userDataSecretRef:
      #   name: cloud-init-config
      #   key: userdata

    storage:
      bootVolumeUriRefRef:
        name: boot-vol

  providerConfigRef:
    name: default
