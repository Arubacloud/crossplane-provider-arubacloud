apiVersion: arubacloud.arubacloud.crossplane.io/v1alpha1
kind: KaaS
metadata:
  name: my-cluster
spec:
  forProvider:
    name: my-cluster
    location: ITBG-Bergamo
    billingPeriod: Hour
    tags:
      - crossplane

    projectIdRef:
      name: my-project

    network:
      # vpcUriRefRef resolves the VPC URI via status.atProvider.uri
      vpcUriRefRef:
        name: main-vpc
      subnetUriRefRef:
        name: private-subnet
      # securityGroupNameRef extracts spec.forProvider.name from the SecurityGroup
      # (KaaS references by display name, not URI)
      securityGroupNameRef:
        name: web-sg
      nodeCidr:
        address: "192.168.100.0/24"
        name: node-network
      podCidr: "10.244.0.0/16"

    settings:
      kubernetesVersion: "1.29"
      ha: false
      nodePools:
        - name: default
          flavorName: KWO4A8
          count: 3
          autoscaling:
            enabled: false

  # kubeconfig is exposed in the connection secret automatically.
  # management_ip is added via AdditionalConnectionDetailsFn.
  writeConnectionSecretToRef:
    name: my-cluster-kubeconfig
    namespace: default

  providerConfigRef:
    name: default
