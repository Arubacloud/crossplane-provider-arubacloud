apiVersion: arubacloud.arubacloud.crossplane.io/v1alpha1
kind: Subnet
metadata:
  name: private-subnet
spec:
  forProvider:
    name: private-subnet
    location: ITBG-Bergamo
    type: Basic
    tags:
      - crossplane
    projectIdRef:
      name: my-project
    vpcIdRef:
      name: main-vpc
  providerConfigRef:
    name: default
---
